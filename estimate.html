<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JL Customs - Estimate</title>
  <script src="config.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="keyboard.css">
  <link rel="stylesheet" href="print.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      height: 100%;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(150% 60% at 50% -20%, #ffffff 0%, rgba(255,255,255,0) 50%),
        linear-gradient(180deg, var(--paper) 0%, #eceae3 100%);
      color: var(--ink);
      font-family: var(--font-ui);
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 18px 32px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 0 var(--brand), var(--shadow-sm);
      flex-shrink: 0;
      z-index: 5;
    }

    #back-btn {
      background: none;
      border: 1.5px solid var(--line-strong);
      color: var(--steel);
      padding: 9px 18px;
      border-radius: var(--r-sm);
      font-family: var(--font-ui);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    #back-btn:hover {
      border-color: var(--ink);
      color: var(--ink);
      background: var(--surface-2);
    }

    header h1 {
      font-family: var(--font-display);
      font-stretch: 112%;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.005em;
    }

    /* ── Scrollable content ── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px 36px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 700px;
      margin: 0 auto;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 0.15s var(--ease), border-color 0.15s var(--ease),
                  box-shadow 0.18s var(--ease), transform 0.1s var(--ease);
      user-select: none;
    }

    .option:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
    }
    .option:active { transform: scale(0.995); }

    /* selected row reads clearly without changing structure */
    .option:has(input:checked) {
      border-color: var(--brand);
      background: var(--brand-tint);
      box-shadow: 0 0 0 1px var(--brand) inset, var(--shadow);
    }

    .option input[type="checkbox"],
    .option input[type="radio"] {
      width: 22px;
      height: 22px;
      accent-color: var(--brand);
      cursor: pointer;
      flex-shrink: 0;
    }

    .option-label {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 500;
    }

    .option-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .option-part-number {
      display: block;
      font-size: 0.78rem;
      color: var(--steel-soft);
      margin-top: 3px;
      letter-spacing: 0.02em;
    }

    .category-heading {
      font-family: var(--font-ui);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--brand);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 22px 2px 8px;
      margin-bottom: 2px;
    }

    /* stamped tick + trailing rule */
    .category-heading::before {
      content: '';
      width: 14px;
      height: 3px;
      background: var(--brand);
      border-radius: 2px;
      flex-shrink: 0;
    }
    .category-heading::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .category-heading:first-child {
      padding-top: 4px;
    }

    /* ── Scrollbar ── */
    main::-webkit-scrollbar {
      width: 8px;
    }

    main::-webkit-scrollbar-track {
      background: transparent;
    }

    main::-webkit-scrollbar-thumb {
      background: var(--line-strong);
      border-radius: var(--r-pill);
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    main::-webkit-scrollbar-thumb:hover {
      background: var(--steel-soft);
      background-clip: padding-box;
    }

    /* ── Footer ── */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(6px);
      border-top: 1px solid var(--line);
      box-shadow: 0 -2px 0 var(--brand), 0 -6px 18px -10px rgba(18,20,26,0.18);
      flex-shrink: 0;
    }

    .price-tracker .tracker-label {
      font-size: 0.72rem;
      color: var(--steel-soft);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .price-tracker .tracker-total {
      font-family: var(--font-display);
      font-stretch: 112%;
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .price-tracker .tracker-count {
      font-size: 0.85rem;
      color: var(--steel);
      margin-top: 4px;
    }

    #checkout-btn {
      padding: 17px 46px;
      font-family: var(--font-display);
      font-stretch: 108%;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      background: linear-gradient(180deg, var(--brand) 0%, var(--brand-strong) 100%);
      color: #fff;
      border: none;
      border-radius: var(--r);
      cursor: pointer;
      box-shadow: var(--shadow-brand);
      transition: filter 0.2s, transform 0.12s, box-shadow 0.2s;
    }

    #checkout-btn:hover { filter: brightness(1.06); box-shadow: var(--shadow-brand), var(--shadow); }
    #checkout-btn:active { transform: scale(0.97); }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(14, 16, 20, 0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      width: min(520px, 90vw);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .modal-overlay.open .modal { animation: modal-pop 0.28s var(--ease) both; }
    @keyframes modal-pop {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }

    .modal-header {
      padding: 18px 24px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      box-shadow: inset 0 -2px 0 var(--brand);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h2 {
      font-family: var(--font-display);
      font-stretch: 110%;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.005em;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--steel-soft);
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      width: 36px;
      height: 36px;
      border-radius: var(--r-sm);
      transition: background 0.18s, color 0.18s;
    }

    .modal-close:hover { color: var(--ink); background: rgba(0,0,0,0.05); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .modal-empty {
      color: var(--steel-soft);
      text-align: center;
      padding: 28px 0;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
      font-size: 1rem;
    }
    .summary-row span:last-child { font-weight: 700; font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }

    .summary-row:last-child { border-bottom: none; }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-grand-total {
      font-family: var(--font-display);
      font-stretch: 110%;
      font-size: 1.4rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .btn-primary {
      padding: 13px 32px;
      font-family: var(--font-ui);
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(180deg, var(--brand) 0%, var(--brand-strong) 100%);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      cursor: pointer;
      box-shadow: var(--shadow-brand);
      transition: filter 0.2s, transform 0.12s, box-shadow 0.2s;
    }

    .btn-primary:hover { filter: brightness(1.06); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: var(--line-strong); color: #fff; cursor: not-allowed; box-shadow: none; filter: none; }

    .btn-back {
      padding: 13px 24px;
      font-family: var(--font-ui);
      font-size: 1rem;
      font-weight: 600;
      background: none;
      border: 1.5px solid var(--line-strong);
      color: var(--steel);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-back:hover { border-color: var(--ink); color: var(--ink); }

    .email-prompt {
      color: var(--steel);
      margin-bottom: 20px;
      font-size: 1rem;
      line-height: 1.55;
    }

    .email-input {
      width: 100%;
      padding: 14px 16px;
      font-family: var(--font-ui);
      font-size: 1.1rem;
      background: var(--surface);
      border: 1.5px solid var(--line-strong);
      border-radius: var(--r-sm);
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .email-input::placeholder { color: var(--steel-soft); }
    .email-input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-ring); }

    .email-error {
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 10px;
      min-height: 1.2em;
      font-weight: 600;
    }

    .confirm-icon {
      font-size: 2rem;
      color: var(--ok);
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(31, 157, 87, 0.12);
      border-radius: 50%;
    }

    .confirm-msg {
      font-size: 1.1rem;
      color: var(--steel);
      line-height: 1.6;
    }

    @media print {
      @page { size: 210mm auto; margin: 6mm; }
      body > * { display: none !important; }
      #print-area { display: block !important; }
    }

    /* Printed estimate / receipt. Authored ~772px wide to match the A40a's
       1632-dot, 203-dpi panel after the render pipeline scales it up (Pi),
       and to fit the system printer's page (Windows). */
    #print-area {
      display: none;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: none;
      padding: 34px 40px 44px;
      box-sizing: border-box;
    }
    #print-area * { margin: 0; padding: 0; box-sizing: border-box; }
    #print-area .r-brand { text-align: center; margin-bottom: 6px; }
    #print-area .r-brand img { width: 300px; height: auto; display: inline-block; }
    #print-area .r-tagline { text-align: center; font-size: 13px; letter-spacing: 3px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    #print-area .r-rule { border: none; border-top: 3px solid #000; margin: 20px 0; }
    #print-area .r-rule-thin { border: none; border-top: 1px solid #000; margin: 14px 0; }
    #print-area .r-title { text-align: center; font-size: 30px; font-weight: 800; letter-spacing: 10px; text-indent: 10px; margin: 4px 0 18px; }
    #print-area .r-meta { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 4px; }
    #print-area .r-meta .r-label { font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; }
    #print-area .r-meta .r-val { font-weight: 700; }
    #print-area .r-block-label { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin: 4px 0 6px; }
    #print-area .r-cust-name { font-size: 20px; font-weight: 800; line-height: 1.2; }
    #print-area .r-cust-line { font-size: 15px; margin-top: 2px; }
    #print-area table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    #print-area thead th { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; text-align: left; padding: 6px 0; border-bottom: 2px solid #000; }
    #print-area thead th.r-num { text-align: right; }
    #print-area tbody td { font-size: 16px; padding: 11px 0; border-bottom: 1px solid #000; vertical-align: top; }
    #print-area tbody td.r-item { font-weight: 700; padding-right: 12px; }
    #print-area tbody td.r-part { font-size: 13px; white-space: nowrap; padding-right: 12px; font-family: "Courier New", monospace; letter-spacing: -0.3px; }
    #print-area tbody td.r-price { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #print-area .r-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; padding-top: 14px; border-top: 3px solid #000; }
    #print-area .r-total .r-t-label { font-size: 17px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
    #print-area .r-total .r-t-val { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
    #print-area .r-foot { margin-top: 26px; text-align: center; font-size: 13px; line-height: 1.7; }
    #print-area .r-foot .r-disc { font-weight: 700; }
    #print-area .r-foot .r-thanks { font-size: 17px; font-weight: 800; letter-spacing: 1px; margin: 14px 0 8px; }
    #print-area .r-foot .r-contact { font-size: 14px; }
    #print-area .r-tear { margin-top: 22px; border-top: 2px dashed #000; padding-top: 8px; text-align: center; font-size: 11px; letter-spacing: 4px; }
  </style>
</head>
<body>

  <header>
    <button id="back-btn">&#8592; Back</button>
    <h1>Build Your Estimate</h1>
  </header>

  <main>
    <div class="options-list" id="options-list"></div>
  </main>

  <footer>
    <div class="price-tracker">
      <div class="tracker-label">Estimated Total</div>
      <div class="tracker-total" id="tracker-total">$0</div>
      <div class="tracker-count" id="tracker-count">0 items selected</div>
    </div>
    <button id="checkout-btn">Review Estimate</button>
  </footer>

  <div id="print-area"></div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Your Estimate</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>

      <div id="step-details">
        <div class="modal-body">
          <p class="email-prompt">Please enter your name and phone number to continue.</p>
          <input type="text" id="name-input" class="email-input" placeholder="Your Name" autocomplete="off" style="margin-bottom: 12px;">
          <input type="tel" id="phone-input" class="email-input" placeholder="Phone Number" autocomplete="off">
          <p class="email-error" id="details-error"></p>
        </div>
        <div class="modal-footer">
          <button class="btn-back" id="btn-cancel-details">Cancel</button>
          <button class="btn-primary" id="btn-continue-details">Continue</button>
        </div>
      </div>

      <div id="step-review">
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" style="flex-direction:column; gap:12px; align-items:stretch;">
          <span class="modal-grand-total" id="modal-grand-total" style="text-align:center;"></span>
          <div style="display:flex; gap:12px;">
            <button class="btn-back" id="btn-print" style="flex:1; text-align:center;">&#128438; Print</button>
            <button class="btn-primary" id="btn-continue" style="flex:1;">&#9993; Email</button>
          </div>
        </div>
      </div>

      <div id="step-email" style="display:none;">
        <div class="modal-body">
          <p class="email-prompt">Enter your email address and we'll send your estimate.</p>
          <input type="email" id="email-input" class="email-input" placeholder="yourname@example.com" autocomplete="off">
          <p class="email-error" id="email-error"></p>
        </div>
        <div class="modal-footer">
          <button class="btn-back" id="btn-back-step">&#8592; Back</button>
          <button class="btn-primary" id="btn-send">Send Estimate</button>
        </div>
      </div>

      <div id="step-confirm" style="display:none;">
        <div class="modal-body" style="text-align:center; padding: 40px 24px;">
          <div class="confirm-icon">&#10003;</div>
          <p class="confirm-msg" id="confirm-msg"></p>
        </div>
        <div class="modal-footer" style="justify-content:center;">
          <button class="btn-primary" id="btn-done">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const serverUrl = window.JLConfig.serverUrl;
    let currentEstimateLeadId = null;
    const company = new URLSearchParams(window.location.search).get('company') || 'Company_1';

    const fmt = (n) => '$' + n.toLocaleString('en-US');

    // Branding printed on the estimate. Update RECEIPT_CONTACT with the shop's
    // real phone / site (kept as placeholders to match the rest of the app).
    const RECEIPT_TAGLINE = 'Commercial Vehicle Upfitting';
    const RECEIPT_CONTACT = '(317) 417-6240 &bull; jl-customs.com';

    // secondary item wrappers: label → element
    const secondaryElements = new Map();

    // ── Config gating (wheelbase + roof → fitment) ──────────────
    // Activated when the loaded data carries `fits` tokens (e.g. "130, LR").
    // The first two steps become Wheelbase then Roof; parts then populate
    // based on which vehicle config they fit.
    let configMode = false;
    let partWrappers = [];   // every part option wrapper (each carries data-fits)
    let roofWrappers = [];   // roof radio wrappers (filtered per wheelbase)
    let roofsByWb = {};      // wheelbase → [roof codes] that exist for it

    const ROOF_NAMES = { LR: 'Low Roof', MR: 'Medium Roof', HR: 'High Roof' };
    const ROOF_ORDER = ['LR', 'MR', 'HR'];
    const roofLabel = (code) => ROOF_NAMES[code] || code;
    const wbLabel = (wb) => /^\d+$/.test(wb) ? `${wb}"` : wb;

    function parseConfigToken(tok) {
      const i = String(tok).indexOf(',');
      if (i === -1) return { wb: String(tok).trim(), roof: '' };
      return { wb: tok.slice(0, i).trim(), roof: tok.slice(i + 1).trim() };
    }

    function makeSection(title) {
      const section = document.createElement('div');
      section.className = 'category-section';
      const heading = document.createElement('div');
      heading.className = 'category-heading';
      heading.textContent = title;
      section.appendChild(heading);
      return section;
    }

    function createConfigOption(groupName, kind, value, labelText, idx) {
      const id = `${kind}-${idx}`;
      const wrapper = document.createElement('div');
      wrapper.className = 'option-wrapper';
      const label = document.createElement('label');
      label.className = 'option';
      label.htmlFor = id;
      label.innerHTML = `
        <input type="radio" name="${groupName}" id="${id}" data-config="1" data-${kind}="${value}">
        <span class="option-label">${labelText}</span>
      `;
      label.querySelector('input').addEventListener('change', updateVisibility);
      wrapper.appendChild(label);
      return wrapper;
    }

    function createPartElement(item, idx, inputType, groupName) {
      const id = `opt-${idx}`;
      const wrapper = document.createElement('div');
      wrapper.className = 'option-wrapper';
      wrapper.dataset.fits = JSON.stringify(Array.isArray(item.fits) ? item.fits : []);
      wrapper.style.display = 'none';
      const label = document.createElement('label');
      label.className = 'option';
      label.htmlFor = id;
      const nameAttr = groupName ? `name="${groupName}"` : '';
      label.innerHTML = `
        <input type="${inputType}" ${nameAttr} id="${id}" data-price="${item.price}" data-label="${item.label}" data-part-number="${item.partNumber || ''}">
        <span class="option-label">
          ${item.label}
          ${item.partNumber ? `<span class="option-part-number">Part #: ${item.partNumber}</span>` : ''}
        </span>
        <span class="option-price">${fmt(item.price)}</span>
      `;
      label.addEventListener('change', updateTotal);
      wrapper.appendChild(label);
      partWrappers.push(wrapper);
      return wrapper;
    }

    function buildConfigModeOptions(data, list) {
      // Gather the valid wheelbase/roof combinations from every item's fits.
      const combos = [];
      const seen = new Set();
      data.forEach(cat => (cat.items || []).forEach(it => (it.fits || []).forEach(tok => {
        if (seen.has(tok)) return;
        seen.add(tok);
        combos.push(parseConfigToken(tok));
      })));

      const wheelbases = [];
      const allRoofs = [];
      roofsByWb = {};
      combos.forEach(c => {
        if (!wheelbases.includes(c.wb)) wheelbases.push(c.wb);
        roofsByWb[c.wb] = roofsByWb[c.wb] || [];
        if (!roofsByWb[c.wb].includes(c.roof)) roofsByWb[c.wb].push(c.roof);
        if (!allRoofs.includes(c.roof)) allRoofs.push(c.roof);
      });
      const rank = (r) => { const i = ROOF_ORDER.indexOf(r); return i === -1 ? 999 : i; };
      allRoofs.sort((a, b) => rank(a) - rank(b));
      Object.values(roofsByWb).forEach(rs => rs.sort((a, b) => rank(a) - rank(b)));

      // Step 1 - Wheelbase
      const wbSection = makeSection('Wheelbase');
      wheelbases.forEach((wb, i) => wbSection.appendChild(createConfigOption('wb-choice', 'wb', wb, wbLabel(wb), i)));
      list.appendChild(wbSection);

      // Step 2 - Roof (hidden until a wheelbase is chosen; options filtered to fit it)
      const roofSection = makeSection('Roof');
      roofSection.classList.add('config-roof-section');
      roofSection.style.display = 'none';
      allRoofs.forEach((roof, i) => {
        const w = createConfigOption('roof-choice', 'roof', roof, roofLabel(roof), i);
        w.dataset.roof = roof;
        roofWrappers.push(w);
        roofSection.appendChild(w);
      });
      list.appendChild(roofSection);

      // Parts - hidden until both wheelbase and roof are chosen
      data.forEach((cat, catIdx) => {
        const section = makeSection(cat.category);
        section.classList.add('part-section');
        section.style.display = 'none';
        const isSingle = (cat.type || 'multiple') === 'single';
        cat.items.forEach((item, i) => {
          const idx = catIdx * 1000 + i;
          const inputType = isSingle ? 'radio' : 'checkbox';
          const groupName = isSingle ? `cat-single-${catIdx}` : null;
          section.appendChild(createPartElement(item, idx, inputType, groupName));
        });
        list.appendChild(section);
      });
    }

    function updateConfigVisibility() {
      const wbInput = document.querySelector('input[name="wb-choice"]:checked');
      const wb = wbInput ? wbInput.dataset.wb : null;

      const roofSection = document.querySelector('.config-roof-section');
      if (roofSection) roofSection.style.display = wb ? '' : 'none';

      // Only offer roofs that exist for the chosen wheelbase.
      const validRoofs = wb ? (roofsByWb[wb] || []) : [];
      roofWrappers.forEach(w => {
        const ok = wb && validRoofs.includes(w.dataset.roof);
        const input = w.querySelector('input');
        if (!ok) {
          if (input && input.checked) input.checked = false;
          w.style.display = 'none';
        } else {
          w.style.display = '';
        }
      });

      const roofInput = document.querySelector('input[name="roof-choice"]:checked');
      const roof = roofInput ? roofInput.dataset.roof : null;
      const ready = Boolean(wb && roof);
      const key = ready ? `${wb}, ${roof}` : null;

      // Show a part if the vehicle is fully specified and the part either fits
      // this exact config or is universal (no fitment restriction).
      partWrappers.forEach(w => {
        const fits = JSON.parse(w.dataset.fits || '[]');
        const visible = ready && (fits.length === 0 || fits.includes(key));
        const input = w.querySelector('input');
        if (!visible) {
          if (input && input.checked) input.checked = false;
          w.style.display = 'none';
        } else {
          w.style.display = '';
        }
      });

      // Hide part categories that ended up with nothing to show.
      document.querySelectorAll('.part-section').forEach(sec => {
        if (!ready) { sec.style.display = 'none'; return; }
        const anyVisible = [...sec.querySelectorAll('.option-wrapper')].some(w => w.style.display !== 'none');
        sec.style.display = anyVisible ? '' : 'none';
      });

      updateTotal();
    }

    function buildOptions(data) {
      const list = document.getElementById('options-list');
      list.innerHTML = '';
      secondaryElements.clear();
      partWrappers = [];
      roofWrappers = [];

      const isHierarchical = data.length > 0 && data[0].category !== undefined;
      configMode = isHierarchical && data.some(cat => (cat.items || []).some(it => Array.isArray(it.fits) && it.fits.length > 0));

      if (configMode) {
        buildConfigModeOptions(data, list);
        return;
      }

      if (isHierarchical) {
        data.forEach((cat, catIdx) => {
          const isPrimary = catIdx === 0;

          const section = document.createElement('div');
          section.className = 'category-section';
          if (!isPrimary) {
            section.classList.add('secondary-section');
            section.style.display = 'none';
          }

          const heading = document.createElement('div');
          heading.className = 'category-heading';
          heading.textContent = cat.category;
          section.appendChild(heading);

          const isSingle = (cat.type || 'multiple') === 'single';
          cat.items.forEach((item, i) => {
            const idx = catIdx * 1000 + i;
            let el;
            if (isPrimary && isSingle) {
              el = createPrimaryElement(item, idx, 'primary-choice');
            } else if (isSingle) {
              el = createSecondaryElement(item, idx, 'radio', `cat-single-${catIdx}`);
            } else {
              el = createSecondaryElement(item, idx, 'checkbox', null);
            }
            section.appendChild(el);
          });

          list.appendChild(section);
        });
      } else {
        // flat data - all checkboxes, no primary gating
        data.forEach((item, i) => list.appendChild(createSecondaryElement(item, i)));
      }
    }

    function createPrimaryElement(item, idx, groupName = 'primary-choice') {
      const id = `primary-${idx}`;
      const wrapper = document.createElement('div');
      wrapper.className = 'option-wrapper';

      const label = document.createElement('label');
      label.className = 'option';
      label.htmlFor = id;
      label.innerHTML = `
        <input type="radio" name="${groupName}" id="${id}" data-price="${item.price}" data-label="${item.label}" data-part-number="${item.partNumber || ''}">
        <span class="option-label">
          ${item.label}
          ${item.partNumber ? `<span class="option-part-number">Part #: ${item.partNumber}</span>` : ''}
        </span>
        <span class="option-price">${fmt(item.price)}</span>
      `;
      label.querySelector('input').addEventListener('change', () => {
        updateVisibility();
      });

      wrapper.appendChild(label);
      return wrapper;
    }

    function createSecondaryElement(item, idx, inputType = 'checkbox', groupName = null) {
      const id = `opt-${idx}`;
      const requires = Array.isArray(item.requires) ? item.requires
        : (item.requires ? item.requires.split('|').map(r => r.trim()) : []);

      const wrapper = document.createElement('div');
      wrapper.className = 'option-wrapper';
      wrapper.dataset.requires = JSON.stringify(requires);
      wrapper.style.display = 'none';

      const label = document.createElement('label');
      label.className = 'option';
      label.htmlFor = id;
      const nameAttr = groupName ? `name="${groupName}"` : '';
      label.innerHTML = `
        <input type="${inputType}" ${nameAttr} id="${id}" data-price="${item.price}" data-label="${item.label}" data-part-number="${item.partNumber || ''}">
        <span class="option-label">
          ${item.label}
          ${item.partNumber ? `<span class="option-part-number">Part #: ${item.partNumber}</span>` : ''}
        </span>
        <span class="option-price">${fmt(item.price)}</span>
      `;
      label.addEventListener('change', updateTotal);

      wrapper.appendChild(label);
      secondaryElements.set(item.label, wrapper);
      return wrapper;
    }

    function getSelectedPrimary() {
      return document.querySelector('input[name="primary-choice"]:checked') || null;
    }

    function updateVisibility() {
      if (configMode) { updateConfigVisibility(); return; }
      const hasPrimaryGating = document.querySelector('input[name="primary-choice"]') !== null;
      const radio = getSelectedPrimary();
      const selectedLabel = radio ? radio.dataset.label : null;

      // Show/hide entire secondary sections
      document.querySelectorAll('.secondary-section').forEach(section => {
        section.style.display = (!hasPrimaryGating || selectedLabel) ? '' : 'none';
      });

      // Show/hide individual secondary items
      secondaryElements.forEach((wrapper, itemLabel) => {
        const requires = JSON.parse(wrapper.dataset.requires || '[]');
        const visible = !hasPrimaryGating
          ? true
          : (selectedLabel && (requires.length === 0 || requires.includes(selectedLabel)));

        if (!visible) {
          const input = wrapper.querySelector('input');
          if (input) input.checked = false;
          wrapper.style.display = 'none';
        } else {
          wrapper.style.display = '';
        }
      });

      updateTotal();
    }

    async function loadOptions() {
      const cacheKey = `cachedEstimateOptions_${company}`;
      let data = null;

      try {
        const res = await fetch(`${serverUrl}/api/estimate-options/${encodeURIComponent(company)}`);
        if (res.ok) {
          const fetched = await res.json();
          if (Array.isArray(fetched) && fetched.length > 0) {
            data = fetched;
            localStorage.setItem(cacheKey, JSON.stringify(data));
          }
        }
      } catch { /* fall through to cache */ }

      if (!data) {
        try {
          const cached = localStorage.getItem(cacheKey);
          if (cached) data = JSON.parse(cached);
        } catch { /* ignore */ }
      }

      if (data && data.length > 0) {
        buildOptions(data);
        updateVisibility();
      } else {
        document.getElementById('options-list').innerHTML =
          '<p style="color:var(--steel);text-align:center;padding:48px 0;font-size:1.05rem;line-height:1.6;">No build options are available for this vehicle yet.<br>Head back and contact an expert - we’ll help you spec it out.</p>';
      }
    }

    loadOptions();

    function getChecked() {
      const results = [];
      results.push(...document.querySelectorAll('input[type="radio"]:checked'));
      results.push(...document.querySelectorAll('input[type="checkbox"]:checked'));
      // Exclude the wheelbase/roof config selectors - they gate parts but aren't line items.
      return results.filter(i => !i.dataset.config);
    }

    function updateTotal() {
      const checked = getChecked();
      const total = checked.reduce((sum, cb) => sum + Number(cb.dataset.price), 0);
      document.getElementById('tracker-total').textContent = fmt(total);
      const n = checked.length;
      document.getElementById('tracker-count').textContent = `${n} item${n !== 1 ? 's' : ''} selected`;
    }

    // ── Modal steps ────────────────────────────────────────────
    function showStep(step) {
      document.getElementById('step-details').style.display = step === 'details' ? '' : 'none';
      document.getElementById('step-review').style.display  = step === 'review'  ? '' : 'none';
      document.getElementById('step-email').style.display   = step === 'email'   ? '' : 'none';
      document.getElementById('step-confirm').style.display = step === 'confirm' ? '' : 'none';
      const titles = { details: 'Your Estimate', review: 'Your Estimate', email: 'Send Your Estimate', confirm: 'Estimate Sent' };
      document.getElementById('modal-title').textContent = titles[step];
    }

    function openModal() {
      const checked = getChecked();
      const total = checked.reduce((sum, cb) => sum + Number(cb.dataset.price), 0);

      if (checked.length === 0) {
        document.getElementById('modal-body').innerHTML = '<p class="modal-empty">No items selected yet.</p>';
      } else {
        document.getElementById('modal-body').innerHTML = checked.map((cb) => {
          const label = cb.dataset.label || '';
          const partNumber = cb.dataset.partNumber;
          const partTag = partNumber ? `<span style="font-size:0.8rem;color:#888;display:block;margin-top:2px;">Part #: ${partNumber}</span>` : '';
          return `<div class="summary-row"><span>${label}${partTag}</span><span>${fmt(Number(cb.dataset.price))}</span></div>`;
        }).join('');
      }

      document.getElementById('modal-grand-total').textContent = `Total: ${fmt(total)}`;
      document.getElementById('name-input').value = sessionStorage.getItem('kiosk_name') || '';
      document.getElementById('phone-input').value = sessionStorage.getItem('kiosk_phone') || '';
      document.getElementById('details-error').textContent = '';
      document.getElementById('email-input').value = '';
      document.getElementById('email-error').textContent = '';
      showStep('details');
      document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
      currentEstimateLeadId = null;
    }

    document.getElementById('checkout-btn').addEventListener('click', openModal);
    document.getElementById('modal-close').addEventListener('click', closeModal);

    document.getElementById('btn-cancel-details').addEventListener('click', closeModal);
    document.getElementById('btn-continue-details').addEventListener('click', () => {
      const name = document.getElementById('name-input').value.trim();
      const phone = document.getElementById('phone-input').value.trim();
      const errorEl = document.getElementById('details-error');
      if (!name) { errorEl.textContent = 'Please enter your name.'; return; }
      if (!phone) { errorEl.textContent = 'Please enter your phone number.'; return; }
      errorEl.textContent = '';
      sessionStorage.setItem('kiosk_name', name);
      sessionStorage.setItem('kiosk_phone', phone);
      fetch(`${serverUrl}/api/leads`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, source: 'estimate' }),
      })
        .then(r => r.json())
        .then(data => { if (data.lead) currentEstimateLeadId = data.lead.id; })
        .catch(() => {});
      showStep('review');
    });
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.getElementById('btn-continue').addEventListener('click', () => showStep('email'));

    document.getElementById('btn-print').addEventListener('click', () => {
      const checked = getChecked();
      const total = checked.reduce((sum, cb) => sum + Number(cb.dataset.price), 0);
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      const rows = checked.map((cb) => {
        const label = cb.dataset.label || '';
        const partNumber = cb.dataset.partNumber || '';
        const partCell = partNumber ? esc(partNumber) : '-';
        return `<tr><td class="r-item">${esc(label)}</td><td class="r-part">${partCell}</td><td class="r-price">${fmt(Number(cb.dataset.price))}</td></tr>`;
      }).join('');

      const name = document.getElementById('name-input').value.trim();
      const phone = document.getElementById('phone-input').value.trim();

      // Vehicle (wheelbase + roof) is known on this page in config mode.
      const wbInput = document.querySelector('input[name="wb-choice"]:checked');
      const roofInput = document.querySelector('input[name="roof-choice"]:checked');
      const vehicle = (wbInput && roofInput)
        ? `${wbLabel(wbInput.dataset.wb)} - ${roofLabel(roofInput.dataset.roof)}`
        : '';

      const custLines = [];
      if (name) custLines.push(`<div class="r-cust-name">${esc(name)}</div>`);
      if (phone) custLines.push(`<div class="r-cust-line">${esc(phone)}</div>`);
      if (vehicle) custLines.push(`<div class="r-cust-line">${esc(vehicle)}</div>`);
      const preparedFor = custLines.length
        ? `<div class="r-block-label">Prepared For</div>${custLines.join('')}`
        : '';

      const estNo = 'A40-' + (1000 + Math.floor(Math.random() * 9000));
      const dateStr = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

      document.getElementById('print-area').innerHTML = `
        <div class="r-brand"><img src="logo.png" alt="JL Customs"></div>
        <div class="r-tagline">${RECEIPT_TAGLINE}</div>
        <hr class="r-rule">
        <div class="r-title">ESTIMATE</div>
        <div class="r-meta">
          <span><span class="r-label">Estimate #&nbsp;</span><span class="r-val">${estNo}</span></span>
          <span><span class="r-label">Date&nbsp;</span><span class="r-val">${dateStr}</span></span>
        </div>
        <hr class="r-rule-thin">
        ${preparedFor}
        <table>
          <thead><tr><th class="r-item">Item</th><th class="r-part">Part #</th><th class="r-num">Price</th></tr></thead>
          <tbody>${rows || '<tr><td class="r-item" colspan="3">No items selected</td></tr>'}</tbody>
        </table>
        <div class="r-total"><span class="r-t-label">Estimated Total</span><span class="r-t-val">${fmt(total)}</span></div>
        <div class="r-foot">
          <div class="r-disc">This is an estimate, not a final invoice.</div>
          <div>Pricing valid for 30 days. Final quote confirmed at drop-off.</div>
          <div class="r-thanks">Thank you for choosing JL Customs</div>
          <div class="r-contact">${RECEIPT_CONTACT}</div>
        </div>
        <div class="r-tear">- - - - -</div>
      `;
      closeModal();
      window.kioskPrint();
    });
    document.getElementById('btn-back-step').addEventListener('click', () => showStep('review'));
    document.getElementById('btn-done').addEventListener('click', closeModal);

    document.getElementById('btn-send').addEventListener('click', async () => {
      const email = document.getElementById('email-input').value.trim();
      const errorEl = document.getElementById('email-error');

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errorEl.textContent = 'Please enter a valid email address.';
        return;
      }

      const btn = document.getElementById('btn-send');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      errorEl.textContent = '';

      const checked = getChecked();
      const items = checked.map((cb) => ({
        label: cb.dataset.label || '',
        price: Number(cb.dataset.price),
        partNumber: cb.dataset.partNumber || '',
      }));
      const total = items.reduce((sum, i) => sum + i.price, 0);

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000);

      try {
        const res = await fetch(`${serverUrl}/api/send-estimate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email,
            items,
            total,
            name: document.getElementById('name-input').value.trim(),
            phone: document.getElementById('phone-input').value.trim(),
          }),
          signal: controller.signal,
        });

        clearTimeout(timeout);

        if (res.ok) {
          if (currentEstimateLeadId) {
            fetch(`${serverUrl}/api/leads/${currentEstimateLeadId}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, items, total }),
            }).catch(() => {});
          }
          document.getElementById('confirm-msg').textContent =
            `Your estimate has been sent to ${email}. Thank you!`;
          showStep('confirm');
        } else {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || 'Failed to send. Please try again.';
        }
      } catch {
        clearTimeout(timeout);
        errorEl.textContent = 'Could not reach the server. Please try again.';
      }

      btn.disabled = false;
      btn.textContent = 'Send Estimate';
    });

    // Navigation
    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = 'home.html';
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const overlay = document.getElementById('modal-overlay');
        if (overlay.classList.contains('open')) closeModal();
        else window.location.href = 'home.html';
      }
    });

    const TIMEOUT_MS = 60 * 1000 * 3;
    let inactivityTimer;

    function resetTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(() => {
        sessionStorage.removeItem('kiosk_name');
        sessionStorage.removeItem('kiosk_phone');
        window.location.href = 'index.html';
      }, TIMEOUT_MS);
    }

    ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'click'].forEach((ev) => {
      document.addEventListener(ev, resetTimer, { passive: true });
    });

    resetTimer();
  </script>

  <script src="keyboard.js"></script>
  <script src="print.js"></script>
</body>
</html>
